[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biorobust"
version = "0.1.0"
description = "Evidence-based robustness profiling for open-source genomic workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "BioRobust contributors" }]
keywords = ["bioinformatics", "genomics", "reproducibility", "open-source", "software-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
biorobust = "biorobust.cli:main"

[project.optional-dependencies]
test = ["jsonschema>=4", "pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


