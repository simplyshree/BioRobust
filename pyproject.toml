[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biorobust"
version = "0.4.0"
description = "Local, evidence-first repository analysis for open-source biological and scientific software."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "BioRobust contributors" }]
keywords = ["biology", "life-sciences", "research-software", "bioinformatics", "genomics", "reproducibility", "open-source", "repository-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["reportlab>=4"]

[project.scripts]
biorobust = "biorobust.cli:main"

[project.urls]
Homepage = "https://github.com/simplyshree/BioRobust"
Repository = "https://github.com/simplyshree/BioRobust"
Issues = "https://github.com/simplyshree/BioRobust/issues"
Documentation = "https://github.com/simplyshree/BioRobust#readme"

[project.optional-dependencies]
test = ["jsonschema>=4", "pytest>=7"]
release = ["build>=1", "twine>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


